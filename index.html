<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Linear Unit Converter</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b1d22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Unit Conv">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
  :root{
    --bg:#1b1d22;
    --card:#25282f;
    --accent:#5aa9ff;
    --text:#eef1f5;
    --sub:#9aa2ad;
    --border:#3a3e46;
    --input-bg:#15171b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:16px;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  h1{
    font-size:1.3rem;
    text-align:center;
    margin:4px 0 18px;
    font-weight:600;
    color:var(--text);
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:12px;
  }
  .label{
    font-size:0.8rem;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--sub);
    margin-bottom:8px;
    display:block;
  }
  input[type="text"], input[type="number"]{
    background:var(--input-bg);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:12px 10px;
    font-size:1.15rem;
    width:100%;
    outline:none;
  }
  input:focus{
    border-color:var(--accent);
  }
  .row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .row input{ min-width:0; }
  .unit-suffix{
    color:var(--sub);
    font-size:1rem;
    white-space:nowrap;
  }
  .frac-row{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .frac-row input{ text-align:center; }
  .frac-row .whole{ flex:2; }
  .frac-row .num{ flex:1; }
  .frac-slash{
    font-size:1.4rem;
    color:var(--sub);
    padding:0 2px;
  }
  .frac-denom{
    flex:1;
    background:var(--input-bg);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 10px;
    font-size:1.15rem;
    text-align:center;
    color:var(--text);
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
    cursor:pointer;
    transition:background 0.15s, border-color 0.15s;
  }
  .frac-denom.pressing{
    background:var(--accent);
    color:#0b0d10;
    border-color:var(--accent);
  }
  .frac-hint{
    display:block;
    text-align:center;
    font-size:0.72rem;
    color:var(--sub);
    margin-top:8px;
  }
  .feet-row{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .feet-row .feet{ flex:1.2; }
  .feet-row .feet-inch-whole{ flex:1; text-align:center; }
  .feet-row .feet-inch-num{ flex:0.8; text-align:center; }
  .feet-row .frac-denom{ flex:0.8; padding:12px 6px; }
  .frac-denom.static{
    cursor:default;
  }
  .feet-mark{
    font-size:1.1rem;
    color:var(--sub);
    white-space:nowrap;
  }
  .reset-btn{
    width:100%;
    background:transparent;
    border:1px solid var(--border);
    color:var(--sub);
    padding:10px;
    border-radius:8px;
    font-size:0.85rem;
    margin-top:6px;
    cursor:pointer;
  }
  .settings-toggle{
    width:100%;
    background:transparent;
    border:1px dashed var(--border);
    color:var(--sub);
    padding:10px;
    border-radius:8px;
    font-size:0.85rem;
    margin-top:14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .settings-panel{
    display:none;
    margin-top:10px;
  }
  .settings-panel.open{
    display:block;
  }
  .color-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px solid var(--border);
  }
  .color-row:last-of-type{
    border-bottom:none;
  }
  .color-row span{
    font-size:0.95rem;
    color:var(--text);
  }
  .color-row input[type="color"]{
    -webkit-appearance:none;
    appearance:none;
    width:44px;
    height:32px;
    border:1px solid var(--border);
    border-radius:6px;
    padding:0;
    background:none;
    cursor:pointer;
  }
  .color-row input[type="color"]::-webkit-color-swatch-wrapper{ padding:2px; }
  .color-row input[type="color"]::-webkit-color-swatch{ border:none; border-radius:4px; }
  .preset-row{
    display:flex;
    gap:8px;
    margin-top:12px;
  }
  .preset-btn{
    flex:1;
    padding:9px 4px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#15171b;
    color:var(--text);
    font-size:0.8rem;
    cursor:pointer;
  }
  .preset-btn:active{
    border-color:var(--accent);
  }
</style>
</head>
<body>

<h1>Linear Unit Converter</h1>

<div class="card">
  <span class="label">Decimal Inches</span>
  <div class="row">
    <input type="text" inputmode="decimal" id="decIn" value="0">
    <span class="unit-suffix">in</span>
  </div>
</div>

<div class="card">
  <span class="label">Millimeters</span>
  <div class="row">
    <input type="text" inputmode="decimal" id="mmIn" value="0">
    <span class="unit-suffix">mm</span>
  </div>
</div>

<div class="card">
  <span class="label">Fractional Inches</span>
  <div class="frac-row">
    <input type="text" inputmode="numeric" class="whole" id="fracWhole" value="0">
    <span class="unit-suffix">in</span>
    <input type="text" inputmode="numeric" class="num" id="fracNum" value="0">
    <span class="frac-slash">/</span>
    <span class="frac-denom" id="fracDenomDisplay">16</span>
  </div>
  <span class="frac-hint" id="precisionHint">Hold denominator to change precision (1/16)</span>
</div>

<div class="card">
  <span class="label">Feet &amp; Inches</span>
  <div class="feet-row">
    <input type="text" inputmode="numeric" class="feet" id="feetIn" value="0">
    <span class="feet-mark">ft</span>
    <input type="text" inputmode="numeric" class="feet-inch-whole" id="feetInchWhole" value="0">
    <input type="text" inputmode="numeric" class="feet-inch-num" id="feetInchNum" value="0">
    <span class="frac-slash">/</span>
    <span class="frac-denom static" id="feetInchDenom">16</span>
    <span class="feet-mark">in</span>
  </div>
</div>

<button type="button" class="reset-btn" id="resetBtn">Reset to 0</button>

<button type="button" class="settings-toggle" id="settingsToggle">&#9881; Appearance</button>
<div class="card settings-panel" id="settingsPanel">
  <div class="color-row">
    <span>Background</span>
    <input type="color" id="colorBg" value="#1b1d22">
  </div>
  <div class="color-row">
    <span>Card</span>
    <input type="color" id="colorCard" value="#25282f">
  </div>
  <div class="color-row">
    <span>Input Background</span>
    <input type="color" id="colorInputBg" value="#15171b">
  </div>
  <div class="color-row">
    <span>Accent</span>
    <input type="color" id="colorAccent" value="#5aa9ff">
  </div>
  <div class="color-row">
    <span>Text</span>
    <input type="color" id="colorText" value="#eef1f5">
  </div>
  <div class="preset-row">
    <button type="button" class="preset-btn" data-preset="dark">Dark</button>
    <button type="button" class="preset-btn" data-preset="light">Light</button>
    <button type="button" class="preset-btn" data-preset="workshop">Workshop</button>
  </div>
  <button type="button" class="reset-btn" id="resetColorsBtn" style="margin-top:10px;">Reset Colors to Default</button>
</div>

<script>
(function(){
  // ---- single source of truth ----
  var totalInches = 0;
  var precisionOptions = [8, 16, 32];
  var precisionIndex = 1; // start at 16

  // ---- elements ----
  var decIn = document.getElementById('decIn');
  var mmIn = document.getElementById('mmIn');
  var fracWhole = document.getElementById('fracWhole');
  var fracNum = document.getElementById('fracNum');
  var fracDenomDisplay = document.getElementById('fracDenomDisplay');
  var precisionHint = document.getElementById('precisionHint');
  var feetIn = document.getElementById('feetIn');
  var feetInchWhole = document.getElementById('feetInchWhole');
  var feetInchNum = document.getElementById('feetInchNum');
  var feetInchDenom = document.getElementById('feetInchDenom');
  var resetBtn = document.getElementById('resetBtn');

  // ---- helpers ----
  function round(v, d){
    var f = Math.pow(10, d);
    return Math.round(v * f) / f;
  }

  function gcd(a, b){
    a = Math.abs(a); b = Math.abs(b);
    while(b){ var t = b; b = a % b; a = t; }
    return a || 1;
  }

  function parseNum(str){
    if(str === null || str === undefined) return NaN;
    str = String(str).trim().replace(',', '.');
    if(str === '' || str === '-') return NaN;
    var v = parseFloat(str);
    return isNaN(v) ? NaN : v;
  }

  function currentPrecision(){
    return precisionOptions[precisionIndex];
  }

  // Given totalInches and a denominator, return {whole, numerator, denom} reduced
  function formatFraction(inches, denom){
    var sign = inches < 0 ? -1 : 1;
    var abs = Math.abs(inches);
    var whole = Math.floor(abs + 1e-9);
    var remainder = abs - whole;
    var numerator = Math.round(remainder * denom);
    if(numerator >= denom){
      whole += 1;
      numerator = 0;
    }
    if(numerator === 0){
      return { whole: sign * whole, numerator: 0, denom: denom };
    }
    var g = gcd(numerator, denom);
    return { whole: sign * whole, numerator: numerator / g, denom: denom / g };
  }

  // ---- refresh all fields from totalInches, optionally skipping the field being actively edited ----
  function refreshAll(skip){
    if(skip !== 'dec'){
      decIn.value = round(totalInches, 4).toString();
    }
    if(skip !== 'mm'){
      mmIn.value = round(totalInches * 25.4, 2).toString();
    }
    if(skip !== 'frac'){
      var f = formatFraction(totalInches, currentPrecision());
      fracWhole.value = f.whole;
      fracNum.value = f.numerator;
      fracDenomDisplay.textContent = f.denom;
    }
    if(skip !== 'feet'){
      var sign = totalInches < 0 ? -1 : 1;
      var absTotal = Math.abs(totalInches);
      var feet = Math.floor(absTotal / 12 + 1e-9);
      var inchesRem = absTotal - feet * 12;
      feetIn.value = sign * feet;
      var fi = formatFraction(inchesRem, currentPrecision());
      // inchesRem is already non-negative, so fi.whole carries no sign here
      feetInchWhole.value = fi.whole;
      feetInchNum.value = fi.numerator;
      feetInchDenom.textContent = fi.denom;
    }
    precisionHint.textContent = 'Hold denominator to change precision (1/' + currentPrecision() + ')';
  }

  // ---- event handlers ----
  decIn.addEventListener('input', function(){
    var v = parseNum(decIn.value);
    if(!isNaN(v)){
      totalInches = v;
      refreshAll('dec');
    }
  });

  mmIn.addEventListener('input', function(){
    var v = parseNum(mmIn.value);
    if(!isNaN(v)){
      totalInches = v / 25.4;
      refreshAll('mm');
    }
  });

  function updateFromFraction(){
    var whole = parseNum(fracWhole.value);
    var num = parseNum(fracNum.value);
    var denom = parseNum(fracDenomDisplay.textContent);
    if(isNaN(whole)) whole = 0;
    if(isNaN(num)) num = 0;
    if(isNaN(denom) || denom === 0) return;
    var sign = whole < 0 ? -1 : 1;
    // if whole is 0 but user intends negative (rare), we skip sign edge case
    totalInches = whole + (sign * (num / denom));
    refreshAll('frac');
  }
  fracWhole.addEventListener('input', updateFromFraction);
  fracNum.addEventListener('input', updateFromFraction);

  // ---- long-press on the denominator to cycle precision ----
  var LONG_PRESS_MS = 500;
  var pressTimer = null;

  function safeVibrate(ms){
    try{
      if(navigator && typeof navigator.vibrate === 'function'){
        navigator.vibrate(ms);
      }
    }catch(e){
      // vibration blocked (e.g. sandboxed preview) - ignore silently
    }
  }

  function startPress(e){
    if(pressTimer) return;
    fracDenomDisplay.classList.add('pressing');
    pressTimer = setTimeout(function(){
      pressTimer = null;
      fracDenomDisplay.classList.remove('pressing');
      precisionIndex = (precisionIndex + 1) % precisionOptions.length;
      refreshAll(null); // full refresh, nothing being actively typed
      safeVibrate(30);
    }, LONG_PRESS_MS);
  }

  function cancelPress(){
    if(pressTimer){
      clearTimeout(pressTimer);
      pressTimer = null;
    }
    fracDenomDisplay.classList.remove('pressing');
  }

  if(window.PointerEvent){
    fracDenomDisplay.addEventListener('pointerdown', startPress);
    fracDenomDisplay.addEventListener('pointerup', cancelPress);
    fracDenomDisplay.addEventListener('pointerleave', cancelPress);
    fracDenomDisplay.addEventListener('pointercancel', cancelPress);
  } else {
    // fallback for environments without Pointer Events support
    fracDenomDisplay.addEventListener('touchstart', function(e){ startPress(e); }, {passive:true});
    fracDenomDisplay.addEventListener('touchend', cancelPress);
    fracDenomDisplay.addEventListener('touchcancel', cancelPress);
    fracDenomDisplay.addEventListener('mousedown', startPress);
    fracDenomDisplay.addEventListener('mouseup', cancelPress);
    fracDenomDisplay.addEventListener('mouseleave', cancelPress);
  }
  // prevent text-selection long-press menu / context menu on the denominator
  fracDenomDisplay.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  function updateFromFeetInches(){
    var feet = parseNum(feetIn.value);
    var inchWhole = parseNum(feetInchWhole.value);
    var num = parseNum(feetInchNum.value);
    var denom = parseNum(feetInchDenom.textContent);
    if(isNaN(feet)) feet = 0;
    if(isNaN(inchWhole)) inchWhole = 0;
    if(isNaN(num)) num = 0;
    if(isNaN(denom) || denom === 0) denom = currentPrecision();
    var sign = feet < 0 ? -1 : 1;
    var inches = inchWhole + (num / denom);
    totalInches = feet * 12 + sign * inches;
    refreshAll('feet');
  }
  feetIn.addEventListener('input', updateFromFeetInches);
  feetInchWhole.addEventListener('input', updateFromFeetInches);
  feetInchNum.addEventListener('input', updateFromFeetInches);

  resetBtn.addEventListener('click', function(){
    totalInches = 0;
    refreshAll(null);
  });

  // ---- appearance / color customization ----
  var DEFAULT_COLORS = { bg:'#1b1d22', card:'#25282f', inputBg:'#15171b', accent:'#5aa9ff', text:'#eef1f5' };
  var STORAGE_KEY = 'linearConverterColors';

  var settingsToggle = document.getElementById('settingsToggle');
  var settingsPanel = document.getElementById('settingsPanel');
  var colorBg = document.getElementById('colorBg');
  var colorCard = document.getElementById('colorCard');
  var colorInputBg = document.getElementById('colorInputBg');
  var colorAccent = document.getElementById('colorAccent');
  var colorText = document.getElementById('colorText');
  var resetColorsBtn = document.getElementById('resetColorsBtn');
  var root = document.documentElement;

  function applyColors(colors){
    root.style.setProperty('--bg', colors.bg);
    root.style.setProperty('--card', colors.card);
    root.style.setProperty('--input-bg', colors.inputBg);
    root.style.setProperty('--accent', colors.accent);
    root.style.setProperty('--text', colors.text);
    colorBg.value = colors.bg;
    colorCard.value = colors.card;
    colorInputBg.value = colors.inputBg;
    colorAccent.value = colors.accent;
    colorText.value = colors.text;
  }

  function saveColors(colors){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(colors));
    }catch(e){
      // storage unavailable (private browsing, etc.) - colors just won't persist
    }
  }

  function loadSavedColors(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return null;
  }

  function currentColorsFromInputs(){
    return {
      bg: colorBg.value,
      card: colorCard.value,
      inputBg: colorInputBg.value,
      accent: colorAccent.value,
      text: colorText.value
    };
  }

  function onColorInputChange(){
    var colors = currentColorsFromInputs();
    applyColors(colors);
    saveColors(colors);
  }
  colorBg.addEventListener('input', onColorInputChange);
  colorCard.addEventListener('input', onColorInputChange);
  colorInputBg.addEventListener('input', onColorInputChange);
  colorAccent.addEventListener('input', onColorInputChange);
  colorText.addEventListener('input', onColorInputChange);

  var PRESETS = {
    dark: { bg:'#1b1d22', card:'#25282f', inputBg:'#15171b', accent:'#5aa9ff', text:'#eef1f5' },
    light:{ bg:'#f2f3f5', card:'#ffffff', inputBg:'#e6e8eb', accent:'#2563eb', text:'#ffffff' },
    workshop:{ bg:'#1c1712', card:'#2a231b', inputBg:'#171310', accent:'#e8871e', text:'#f5efe6' }
  };

  var presetButtons = document.querySelectorAll('.preset-btn');
  for(var i = 0; i < presetButtons.length; i++){
    presetButtons[i].addEventListener('click', function(e){
      var key = e.currentTarget.getAttribute('data-preset');
      var colors = PRESETS[key];
      if(colors){
        applyColors(colors);
        saveColors(colors);
      }
    });
  }

  resetColorsBtn.addEventListener('click', function(){
    applyColors(DEFAULT_COLORS);
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  });

  settingsToggle.addEventListener('click', function(){
    settingsPanel.classList.toggle('open');
  });

  // apply any saved colors on load
  var saved = loadSavedColors();
  if(saved) applyColors(saved);

  // ---- initial paint ----
  refreshAll(null);

  // ---- register service worker for offline / installable support ----
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(err){
        // registration can fail harmlessly when previewed from file:// or a sandboxed frame
        console.warn('Service worker registration failed:', err);
      });
    });
  }
})();
</script>

</body>
</html>
